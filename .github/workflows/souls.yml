name: Build Ashen Vow APK
on:
  push:
    paths:
      - 'souls-app/**'
      - '.github/workflows/souls.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: souls-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk AshenVow.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ashen-build-${{ github.run_number }}
          name: Ashen Vow build ${{ github.run_number }}
          files: souls-app/AshenVow.apk
