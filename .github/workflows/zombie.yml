name: Build Zombie Dots APK
on:
  push:
    paths:
      - 'zombie-app/**'
      - '.github/workflows/zombie.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zombie-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk ZombieDots.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: zombie-build-${{ github.run_number }}
          name: Zombie Dots build ${{ github.run_number }}
          files: zombie-app/ZombieDots.apk
