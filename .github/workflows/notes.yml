name: Build Notes APK
on:
  push:
    paths:
      - 'notes-app/**'
      - '.github/workflows/notes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notes-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Notes.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: notes-build-${{ github.run_number }}
          name: Notes build ${{ github.run_number }}
          files: notes-app/Notes.apk
