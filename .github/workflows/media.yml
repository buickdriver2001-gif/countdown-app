name: Build MediaFind APK
on:
  push:
    paths:
      - 'media-app/**'
      - '.github/workflows/media.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk MediaFind.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: media-build-${{ github.run_number }}
          name: MediaFind build ${{ github.run_number }}
          files: media-app/MediaFind.apk
