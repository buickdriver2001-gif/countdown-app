name: Build Game Hub APK
on:
  push:
    paths:
      - 'hub-app/**'
      - '.github/workflows/hub.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk GameHub.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: hub-build-${{ github.run_number }}
          name: Game Hub build ${{ github.run_number }}
          files: hub-app/GameHub.apk
