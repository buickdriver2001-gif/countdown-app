name: Build NEXUS APK
on:
  push:
    paths:
      - 'hub-app/**'
      - '.github/workflows/hub.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk NEXUS.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nexus-build-${{ github.run_number }}
          name: ${{ github.run_number == 161 && 'NEXUS 1.0' || format('NEXUS build {0}', github.run_number) }}
          files: hub-app/NEXUS.apk
