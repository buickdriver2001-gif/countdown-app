name: Build APK
on:
  push:
    paths-ignore:
      - 'notes-app/**'
      - 'synth-app/**'
      - '.github/workflows/**'
      - '*.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Countdown.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Countdown build ${{ github.run_number }}
          files: Countdown.apk
